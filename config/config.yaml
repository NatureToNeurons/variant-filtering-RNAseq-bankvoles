###############################################################################
# Project Information
###############################################################################

project:
  name: "variant-filtering-RNAseq-bankvoles"
  version: "1.0.0"
  author: "Ayushi Pathak"

###############################################################################
# Resources
###############################################################################

resources:
  threads: 8
  memory: "32G"

###############################################################################
# Reference Files
###############################################################################

reference:
  genome: "data/reference/genome.fa"
  annotation: "data/reference/annotation.gtf"

###############################################################################
# RNA-Seq Alignment
###############################################################################

star:
  threads: 8
  outSAMtype: "BAM SortedByCoordinate"

###############################################################################
# Picard
###############################################################################

picard:
  remove_duplicates: false

###############################################################################
# GATK
###############################################################################

gatk:
  java_memory: "16G"

###############################################################################
# Quality Control
###############################################################################

fastqc:
  threads: 8

multiqc:
  enabled: true
